#loot-app{gap:0}

#loot-app .wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:0;width:100%;border:2px solid var(--parchment-border);border-radius:8px;overflow:hidden;background:var(--parchment-light)}
#loot-app .side{background:linear-gradient(160deg,var(--leather-mid),var(--leather-rich));color:var(--gold-pale);padding:26px 22px;border-right:2px solid var(--gold-dark)}
#loot-app .side h1{font-size:28px;color:var(--gold-bright)}
#loot-app .side p{color:#e7d6ab;margin:6px 0 18px;font-size:16px}
#loot-app label{display:block;font-size:15px;color:#e7d6ab;margin-bottom:4px}
#loot-app select,#loot-app input{font:inherit;font-size:16px;color:var(--ink-dark);background:var(--parchment-light);border:1px solid var(--parchment-border);border-radius:6px;padding:8px 10px;min-height:44px;width:100%}
#loot-app select:focus-visible,#loot-app input:focus-visible,#loot-app button:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px}
#loot-app .row{display:grid;grid-template-columns:1.2fr .8fr .7fr 44px;gap:8px;align-items:end;margin-bottom:8px}
#loot-app .row .x{background:transparent;color:var(--gold-pale);border:1px solid var(--gold-dark);border-radius:6px;min-height:44px;font-size:20px;cursor:pointer}
#loot-app .field{margin-bottom:14px}
#loot-app .btn{font:inherit;font-family:Cinzel,Georgia,serif;font-weight:700;border:0;border-radius:6px;min-height:44px;padding:10px 16px;cursor:pointer}
#loot-app .add{background:transparent;color:var(--gold-pale);border:1px dashed var(--gold-leaf);width:100%;margin:4px 0 16px}
#loot-app .roll{background:linear-gradient(var(--gold-bright),var(--gold-leaf));color:var(--leather-dark);width:100%;font-size:18px;min-height:52px;box-shadow:0 2px 0 var(--gold-dark)}
#loot-app .check{display:flex;gap:10px;align-items:center;font-size:16px;color:var(--gold-pale);margin:4px 0 18px;cursor:pointer}
#loot-app .check input{width:22px;min-height:22px;height:22px;accent-color:var(--gold-leaf)}
#loot-app .summary{margin-top:16px;font-size:15px;color:#e7d6ab;line-height:1.6}
#loot-app .summary b{color:var(--gold-bright)}
#loot-app main{padding:26px clamp(16px,3vw,36px)}
#loot-app .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink-crimson);padding-bottom:10px}
#loot-app .head h2{font-size:clamp(26px,3.5vw,38px)}
#loot-app .total{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(28px,4.5vw,44px);color:var(--ink-amber);white-space:nowrap}
#loot-app .sub{color:var(--ink-muted);font-size:16px;margin:6px 0 0}
#loot-app .items{list-style:none;margin:0;padding:0}
#loot-app .items li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--parchment-aged)}
#loot-app .kind{font-family:Cinzel,Georgia,serif;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;justify-self:start;background:var(--parchment-mid);color:var(--ink-sepia);border:1px solid var(--parchment-aged)}
#loot-app .k-magic{background:#dcefe9;color:var(--tab-misc-mid);border-color:#a9d2c6}
#loot-app .k-coins,#loot-app .k-valuables{background:var(--gold-pale);color:var(--ink-amber);border-color:var(--gold-leaf)}
#loot-app .name{font-weight:700;font-size:18px}
#loot-app .det{display:block;font-weight:400;color:var(--ink-muted);font-size:15px;font-style:italic}
#loot-app .gp{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;font-weight:600}
#loot-app .empty{padding:40px 0;color:var(--ink-muted);font-size:18px}
#loot-app .tools{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
#loot-app .ghost{background:var(--parchment-mid);color:var(--ink-sepia);border:1px solid var(--parchment-border)}
#loot-app .note{font-size:15px;color:var(--ink-muted);margin:6px 0}
#loot-app details{margin:12px 0;border-top:1px solid var(--parchment-aged);padding-top:10px}

.toast.on{opacity:1}

    <h1>Sparks Loot Roller</h1>
    <p>Add the monsters the party defeated, then roll. Values follow the Sparks Random Loot Tables.</p>

      <select id="lvl"></select></div>
    <div id="mons"></div>

    <div class="tools">

      <button class="btn ghost" id="copy" type="button">Copy as text</button>
    </div>
    <p class="note" id="fix"></p>
    <details><summary>Dice log</summary><ol class="log" id="log"></ol></details>

          <option value="weapon">Random Weapon</option><option value="armor">Random Armor</option><option value="shield">Random Shield</option>
          <option value="found">Coins: found as (d8)</option><option value="lairspot">Hoard: where it lies (d8)</option></select></div>
        <div><label for="tband">Band</label><select id="tband">
          <option value="1">Band 1 (TR 1 to 4)</option><option value="2">Band 2 (TR 5 to 8)</option><option value="3">Band 3 (TR 9 to 12)</option>
          <option value="4">Band 4 (TR 13 to 17)</option><option value="5">Band 5 (TR 18 to 25)</option></select></div>
        <button class="btn" id="one" type="button">Roll</button>
      </div>
      <div class="out" id="oneOut"></div>
    </section>
  </main>
</div>

function shield(){const s=SHIELDS[die(6,'Random Shield')-1];return {name:s[0],gp:s[1]}}

function coins(b){const n=roll('2d6','Coins');const v=n*COINX[b];const f=FOUND[die(8,'Found as')-1];return [item('coins',gp(v)+' in coins',v,f)]}
function valuables(b){if(die(6,'Gems or art (1 to 3 gems)')<=3){const q=roll('1d4','Number of gems');const names=[];for(let i=0;i<q;i++)names.push(GEMS[b][die(8,'Gem')-1]);return [item('valuables',`${q} gem${q>1?'s':''}`,q*GEMV[b],`${names.join(', ')}. ${gp(GEMV[b])} each`)]}
  const a=ART[b][die(8,'Art object')-1];return [item('valuables',a,ARTV[b],'Art object')]}
function gear(b){if(b>3){LOG.push('Band '+b+' rolls no gear');return []}const e=GEAR[b][die(20,'Gear')-1];
  if(e==='weapon'){const w=weapon();return [item('gear',w.name,w.gp,'Weapon')]}
  if(e==='exotic'){const w=exotic();return [item('gear',w.name,w.gp,'Exotic weapon')]}
  if(e==='armor'){const a=armor();return [item('gear',a.name,a.gp,'Armor')]}
  if(e==='shield'){const s=shield();return [item('gear',s.name,s.gp,'Shield')]}
  if(e==='silver'){const w=weapon();return [item('gear',w.name+' with Silver Coating',w.gp+100,'Overcomes silver resistance')]}
  if(e==='plat'){const w=weapon();return [item('gear',w.name+' with Platinum Coating',w.gp+1000,'Overcomes platinum resistance')]}
  const q=e[2]?roll(e[2],e[0]):1;return [item('gear',(q>1?q+' × ':'')+e[0],e[1]*q,q>1?gp(e[1])+' each':'')]}
function consumable(b,depth){depth=depth||0;const r=die(12,'Consumable, Band '+b);const e=CONS[b][r-1];
  if(e==='twice'){if(depth>3)return [];return consumable(b,depth+1).concat(consumable(b,depth+1))}
  if(e==='b4twice')return consumable(4,depth+1).concat(consumable(4,depth+1));
  if(e==='elix'){const q=roll('1d4','Elixirs');const out=[];for(let i=0;i<q;i++){const n=ELIX[die(4,'Elixir')-1];out.push(item('consumable',n,2000))}return out}
  return e.map(p=>{const q=p[2]?roll(p[2],p[0]):1;return item('consumable',(q>1?q+' × ':'')+p[0],p[1]*q,q>1?gp(p[1])+' each':'')})}
function magicBase(b){const r=die(20,'Magic item, Band '+b);const e=MAGIC[b][r-1];
  if(typeof e==='number'){const k=die(6,'Weapon, armor or shield (1 to 3 weapon, 4 to 5 armor, 6 shield)');const base=k<=3?weapon():k<=5?armor():shield();
    return item('magic',`+${e} ${base.name}`,PLUS[e]+base.gp,`Magical bonus +${e} (${gp(PLUS[e])}). The GM adds magic traits worth +${e}.`)}
  if(e==='ring'){const s=STATS[die(7,'Stat ring')-1];return item('magic','Ring of '+s,10000,'Stat ring')}
  return item('magic',e[0],e[1],'Marionette\'s Market item')}
function magic(b,cap){for(let t=0;t<25;t++){const it=magicBase(b);if(it.value<=cap)return [it];LOG.push(`${it.name} costs ${gp(it.value)}, over the ${gp(cap)} cap. Reroll.`)}
  if(b>1){LOG.push('No item under the cap in Band '+b+'. Rolling Band '+(b-1)+'.');return magic(b-1,cap)}return []}
function lootType(b,cap){const r=die(100,'Loot Type, Band '+b);const t=TYPE[b];
  if(r<=t[0])return coins(b);if(r<=t[1])return valuables(b);if(r<=t[2])return gear(b);if(r<=t[3])return consumable(b);return magic(b,cap)}

// ---------- state & UI
let state={lvl:6,lair:false,mons:[{tier:'solo',tr:8,n:1},{tier:'minion',tr:4,n:4}]};
try{const s=JSON.parse(localStorage.getItem('sparks-loot')||'null');if(s&&s.mons)state=s}catch(e){}
const save=()=>{try{localStorage.setItem('sparks-loot',JSON.stringify(state))}catch(e){}};
$('lvl').innerHTML=Array.from({length:25},(_,i)=>`<option value="${i+1}">Level ${i+1} · cap ${gp(WEALTH[i]/2)}</option>`).join('');
function drawMons(){$('mons').innerHTML=state.mons.map((m,i)=>`<div class="row">
  <div><label for="t${i}">Tier</label><select id="t${i}" data-i="${i}" data-k="tier">${['minion','elite','solo'].map(t=>`<option value="${t}"${m.tier===t?' selected':''}>${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select></div>
  <div><label for="r${i}">TR</label><input id="r${i}" type="number" min="1" max="25" value="${m.tr}" data-i="${i}" data-k="tr"></div>
  <div><label for="n${i}">Count</label><input id="n${i}" type="number" min="1" max="99" value="${m.n}" data-i="${i}" data-k="n"></div>
  <button class="x" type="button" data-del="${i}" aria-label="Remove monster ${i+1}">×</button></div>`).join('');summary()}
const valOf=m=>{const tr=Math.min(25,Math.max(1,+m.tr||1)),n=Math.max(1,+m.n||1);return (m.tier==='minion'?MINION[tr-1]:m.tier==='solo'?ELITE[tr-1]*2:ELITE[tr-1])*n};
function calc(){const total=state.mons.reduce((a,m)=>a+valOf(m),0);const top=Math.max(1,...state.mons.map(m=>Math.min(25,+m.tr||1)));const b=bandOf(top);const cap=WEALTH[state.lvl-1]/2;return {total,b,cap,rolls:Math.max(1,Math.floor(total/UNIT[b]))}}
function summary(){const c=calc();$('sum').innerHTML=`Treasure value <b>${gp(c.total)}</b><br>Band <b>${c.b}</b> · ${state.lair?'<b>Lair hoard</b>':`<b>${c.rolls}</b> Loot Type roll${c.rolls>1?'s':''} at ${gp(UNIT[c.b])} each`}<br>Magic item cap <b>${gp(c.cap)}</b>`}
$('mons').addEventListener('input',e=>{const t=e.target;if(!t.dataset.k)return;const m=state.mons[+t.dataset.i];m[t.dataset.k]=t.dataset.k==='tier'?t.value:Math.max(1,Math.min(t.dataset.k==='tr'?25:99,+t.value||1));save();summary()});
$('mons').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;state.mons.splice(+b.dataset.del,1);if(!state.mons.length)state.mons.push({tier:'elite',tr:1,n:1});save();drawMons()});
$('addMon').addEventListener('click',()=>{const last=state.mons[state.mons.length-1]||{tier:'elite',tr:1,n:1};state.mons.push({tier:'elite',tr:last.tr,n:1});save();drawMons();const f=$('t'+(state.mons.length-1));f&&f.focus()});
$('lvl').addEventListener('change',e=>{state.lvl=+e.target.value;save();summary()});
$('lair').addEventListener('change',e=>{state.lair=e.target.checked;save();summary()});

let last=null;
function rollHaul(){LOG=[];const c=calc();let out=[];let fix='';
  if(state.lair){const h=HOARD[c.b];LOG.push('Lair hoard, Band '+c.b);
    h.m.forEach(([band,q])=>{const k=roll(q,'Magic items from Band '+band);for(let i=0;i<k;i++){const left=c.total-out.reduce((a,x)=>a+x.value,0);out=out.concat(magic(band,Math.min(c.cap,Math.max(left,0))))}});
    const k=roll(h.c,'Consumable rolls');for(let i=0;i<k;i++)out=out.concat(consumable(c.b));
    for(let i=0;i<h.v;i++)out=out.concat(valuables(c.b));
    const spot=LAIRSPOT[die(8,'Where the hoard lies')-1];
    let sum=out.reduce((a,x)=>a+x.value,0);
    if(sum>c.total*1.25){const dropped=[];const pool=out.filter(x=>x.kind!=='magic').sort((a,b)=>b.value-a.value);
      while(sum>c.total*1.25&&pool.length){const x=pool.shift();dropped.push(x.name);sum-=x.value;out.splice(out.indexOf(x),1)}
      fix=`The hoard ran more than 25% over its treasure value, so these were left out: ${dropped.join(', ')}.`}
    const left=c.total-sum;
    if(left>0)out.push(item('coins',gp(left)+' in coins',left,'The rest of the hoard'));
    out.unshift(item('note','Where it lies',0,spot));
  }else{
    for(let i=0;i<c.rolls;i++)out=out.concat(lootType(c.b,c.cap));
    let sum=out.reduce((a,x)=>a+x.value,0);
    if(sum>c.total*1.25&&out.length>1){const dropped=[];const sorted=out.slice().sort((a,b)=>a.value-b.value);
      for(const x of sorted){if(sum<=c.total*1.25||out.length<=1)break;if(sum-x.value<c.total)continue;dropped.push(x.name);sum-=x.value;out.splice(out.indexOf(x),1)}
      fix=dropped.length?`Over budget by more than 25%, so the cheapest results were dropped: ${dropped.join(', ')}.`:'';
      if(sum>c.total*1.25)fix+=(fix?' ':'')+`Still ${gp(sum-c.total)} over budget: one big item carries the haul. Keep it, or reroll.`}
    if(sum<c.total){const gap=c.total-sum;out.push(item('coins',gp(gap)+' in coins',gap,'Makes up the treasure value'));fix=(fix?fix+' ':'')+`Under budget, so ${gp(gap)} in coins makes up the gap.`}
  }
  last={c,out,fix,log:LOG.slice()};render()}
function render(){if(!last)return;const {c,out,fix,log}=last;const sum=out.reduce((a,x)=>a+x.value,0);
  $('total').textContent=gp(sum);
  $('meta').textContent=`Budget ${gp(c.total)} · Band ${c.b} · ${state.lair?'Lair hoard':c.rolls+' roll'+(c.rolls>1?'s':'')} · cap ${gp(c.cap)}`;
  $('items').innerHTML=out.map(x=>`<li><span class="kind k-${x.kind}">${x.kind==='note'?'Hoard':x.kind[0].toUpperCase()+x.kind.slice(1)}</span><span class="name">${esc(x.name)}${x.det?`<span class="det">${esc(x.det)}</span>`:''}</span><span class="gp">${x.value?gp(x.value):''}</span></li>`).join('')||'<li class="empty" style="display:block;border:0">Nothing this time.</li>';
  $('fix').textContent=fix;$('log').innerHTML=log.map(l=>`<li>${esc(l)}</li>`).join('')}
$('roll').addEventListener('click',rollHaul);$('again').addEventListener('click',rollHaul);
const toast=t=>{const el=$('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1600)};
$('copy').addEventListener('click',()=>{if(!last){toast('Roll some loot first.');return}const sum=last.out.reduce((a,x)=>a+x.value,0);
  const txt=`Loot (Band ${last.c.b}, budget ${gp(last.c.total)}): ${gp(sum)}\n`+last.out.map(x=>`- ${x.name}${x.det?' ('+x.det+')':''}${x.value?': '+gp(x.value):''}`).join('\n');
  try{navigator.clipboard.writeText(txt).then(()=>toast('Copied.'),()=>toast('Copy was blocked. Select the list instead.'))}catch(e){toast('Copy was blocked. Select the list instead.')}});
$('one').addEventListener('click',()=>{LOG=[];const b=+$('tband').value,t=$('tbl').value,cap=Infinity;let res;
  const show=arr=>arr.map(x=>`<b>${esc(x.name)}</b>${x.det?' · '+esc(x.det):''}${x.value?' · '+gp(x.value):''}`).join('<br>')||'Nothing';
  if(t==='type'){const r=die(100,'');const k=TYPE[b];res=`d100 ${r}: <b>${r<=k[0]?'Coins':r<=k[1]?'Valuables':r<=k[2]?'Gear':r<=k[3]?'Consumable':'Magic item'}</b>`}
  else if(t==='coins')res=show(coins(b));else if(t==='val')res=show(valuables(b));else if(t==='gear')res=show(gear(b));
  else if(t==='cons')res=show(consumable(b));else if(t==='magic')res=show(magic(b,cap));
  else if(t==='weapon'){const w=weapon();res=`<b>${esc(w.name)}</b> · ${gp(w.gp)}`}else if(t==='armor'){const a=armor();res=`<b>${esc(a.name)}</b> · ${gp(a.gp)}`}
  else if(t==='shield'){const s=shield();res=`<b>${esc(s.name)}</b> · ${gp(s.gp)}`}
  else if(t==='found')res=esc(FOUND[d(8)-1]);else res=esc(LAIRSPOT[d(8)-1]);
  $('oneOut').innerHTML=res+(LOG.length?`<div class="note">${LOG.map(esc).join(' · ')}</div>`:'')});
$('lvl').value=state.lvl;$('lair').checked=!!state.lair;drawMons();
}
</script>
</body>
</html>
